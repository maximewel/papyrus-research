version: '3.8'  # You can specify a different version if needed

services:
  training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: training_container
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - ../data:/workspace/data
      - ./model_store:/workspace/source/model_store

    # Optional environment variables
    environment:
      PYTHONUNBUFFERED: 1
      # Used to change training
      TRAIN_DATASET_NAME: "brush_96.96_train_s_aug"
      TEST_DATASET_NAME: "brush_96.96_test_s_aug"

      NORMALIZE_COORDS: 0
      USE_PREDICTION_TOKEN: 0
      USE_LSTM: 0
      LSTM_MODEL_PATH: "path/to/model"

      BATCH_SIZE: 32
      PATCHES_DIM: "16, 16"
      EMBEDDING_DIMS: 256
      IMAGE_MAX_SHAPE: "96, 96"

      N_EPOCHS: 5
      LR: 0.001

      WEIGHT_COORD: 1.0
      WEIGHT_SKELETON: 1.0

      ENCODER_HEADS: 8
      DECODER_HEADS: 8

      ENCODER_LAYERS: 6
      DECODER_LAYERS: 6
      AUTOREGRESS_TARGET_LEN: 100
      MAKE_POSITIONAL_ENCODING_LEARNABLE: 0