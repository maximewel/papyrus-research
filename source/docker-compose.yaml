version: '3.8'  # You can specify a different version if needed

services:
  training:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: training_container

    volumes:
      - ../data:/workspace/data
      - ./model_store:/workspace/source/model_store

    # Optional environment variables
    environment:
      PYTHONUNBUFFERED: 1
      # Used to change training
      USE_BRUSH: 0
      NORMALIZE_COORDS: 0
      USE_PREDICTION_TOKEN: 0
      USE_LSTM: 0
      LSTM_MODEL_PATH: "path/to/model"

      BATCH_SIZE: 64
      PATCHES_DIM: "8, 8"
      EMBEDDING_DIMS: 256

      N_EPOCHS: 5
      LR: 0.001
      TRAIN_SIZE: 0.80
      DATASET_SIZE: 0.3
      DROPOUT_RATIO: 0.05

      WEIGHT_EOS: 1.0
      WEIGHT_COORD: 1.0
      WEIGHT_SKELETON: 1.0

      ENCODER_HEADS: 8
      DECODER_HEADS: 8

      ENCODER_LAYERS: 8
      DECODER_LAYERS: 8
      AUTOREGRESS_TARGET_LEN: 500
      MAKE_POSITIONAL_ENCODING_LEARNABLE: 0